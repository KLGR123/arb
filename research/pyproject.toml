[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arb-research"
version = "0.1.0"
description = "Offline dependency smoke for arb's two research engines"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vectorbt==0.28.5",
  "nautilus_trader==1.231.0",
  "pandas>=2.2.3,<3",
  # VectorBT 0.28's built-in themes still use scattermapbox (removed in Plotly 7).
  "plotly>=5.24.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arb_research"]
