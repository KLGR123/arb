[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arb-research"
version = "0.1.0"
description = "Offline dual-engine backtest API and durable jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vectorbt==0.28.5",
  "nautilus_trader==1.231.0",
  "pandas>=2.2.3,<3",
  # VectorBT 0.28's built-in themes still use scattermapbox (removed in Plotly 7).
  "plotly>=5.24.1,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "duckdb>=1.4,<3",
  "pyarrow>=19,<27",
  "polymarket-client==0.15.0",
  "httpx[socks]>=0.28.1,<0.29",
  "pydantic>=2.11,<3",
  "websockets>=15,<16",
  "python-socks[asyncio]>=2.7,<3",
]

[project.optional-dependencies]
# The 1.231.0 adapter imports this V2 SDK even on its data-only path.
# This is NOT the archived py-clob-client package. No client is constructed.
polymarket-validation = ["py-clob-client-v2==1.0.2"]

[project.scripts]
polymarket-data = "arb_research.polymarket.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/arb_research"]
